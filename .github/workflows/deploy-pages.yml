name: Deploy static portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and content tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build static export
        run: npm run build
      - name: Check internal links
        run: npm run check:links
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
      - name: Upload static export for browser QA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-export
          path: out
          include-hidden-files: true

  browser-qa:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install isolated QA tools
        run: npm ci --prefix .github/qa
      - name: Install browser
        run: .github/qa/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Download production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: static-export
          path: out
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory out > /tmp/portfolio-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Accessibility, responsive and runtime audit
        env:
          Q_AUDIT_TOOLS: ${{ github.workspace }}/.github/qa/node_modules
          Q_AUDIT_BROWSER: ${{ matrix.browser }}
        run: node scripts/audit-site.mjs http://localhost:4173 qa-results
      - name: Touch, keyboard, theme, dialogs and navigation
        env:
          Q_AUDIT_TOOLS: ${{ github.workspace }}/.github/qa/node_modules
          Q_AUDIT_BROWSER: ${{ matrix.browser }}
        run: node scripts/qa-interactions.mjs http://localhost:4173 qa-results
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-${{ matrix.browser }}
          path: qa-results

  safari-qa:
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install QA tools
        run: npm ci --prefix .github/qa
      - name: Download production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: static-export
          path: out
      - name: Start native Safari driver and static server
        run: |
          sudo safaridriver --enable
          safaridriver -p 4444 > /tmp/safari-driver.log 2>&1 &
          python3 -m http.server 4173 --directory out > /tmp/portfolio-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4444/status > /dev/null && curl --fail --silent http://localhost:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Native Safari accessibility and layout
        env:
          Q_AUDIT_TOOLS: ${{ github.workspace }}/.github/qa/node_modules
        run: node scripts/qa-safari.mjs http://localhost:4173 qa-results
      - name: Upload Safari evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-safari
          path: qa-results

  cloudflare:
    if: github.ref == 'refs/heads/main'
    needs: [build, browser-qa, safari-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download verified export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: static-export
          path: out
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name=adulsaa-q --branch=main --commit-dirty=true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, browser-qa, safari-qa]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
