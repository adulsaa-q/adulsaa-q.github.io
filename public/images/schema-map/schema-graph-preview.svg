<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117" />
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.75" />
    </pattern>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.4" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.6" />

  <!-- Connecting Edges -->
  <line x1="200" y1="140" x2="400" y2="180" stroke="#388bfd" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />
  <line x1="400" y1="180" x2="620" y2="200" stroke="#238636" stroke-width="2" opacity="0.8" />
  <line x1="620" y1="200" x2="580" y2="340" stroke="#388bfd" stroke-width="2" opacity="0.6" />
  <line x1="580" y1="340" x2="350" y2="350" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5" />
  <line x1="220" y1="280" x2="400" y2="180" stroke="#238636" stroke-width="2" opacity="0.8" />

  <!-- Table 1: customers -->
  <g transform="translate(130, 90)">
    <rect width="140" height="95" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <rect width="140" height="26" rx="6" fill="#21262d" />
    <text x="12" y="18" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">⌗ customers</text>
    <text x="12" y="44" fill="#7ee787" font-family="monospace" font-size="11">PK id (UUID)</text>
    <text x="12" y="62" fill="#c9d1d9" font-family="monospace" font-size="11">email (VARCHAR)</text>
    <text x="12" y="80" fill="#8b949e" font-family="monospace" font-size="11">tier (VARCHAR)</text>
  </g>

  <!-- Table 2: orders -->
  <g transform="translate(330, 130)">
    <rect width="150" height="110" rx="6" fill="#161b22" stroke="#238636" stroke-width="2" />
    <rect width="150" height="28" rx="6" fill="#238636" fill-opacity="0.2" />
    <text x="12" y="20" fill="#7ee787" font-family="monospace" font-size="13" font-weight="bold">⌗ orders [FACT]</text>
    <text x="12" y="48" fill="#7ee787" font-family="monospace" font-size="11">PK id (UUID)</text>
    <text x="12" y="66" fill="#58a6ff" font-family="monospace" font-size="11">FK customer_id</text>
    <text x="12" y="84" fill="#c9d1d9" font-family="monospace" font-size="11">total_amount (DEC)</text>
    <text x="12" y="102" fill="#8b949e" font-family="monospace" font-size="11">status (VARCHAR)</text>
  </g>

  <!-- Table 3: order_items -->
  <g transform="translate(550, 150)">
    <rect width="150" height="100" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <rect width="150" height="26" rx="6" fill="#21262d" />
    <text x="12" y="18" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">⌗ order_items</text>
    <text x="12" y="44" fill="#7ee787" font-family="monospace" font-size="11">PK id (BIGINT)</text>
    <text x="12" y="62" fill="#58a6ff" font-family="monospace" font-size="11">FK order_id (UUID)</text>
    <text x="12" y="80" fill="#58a6ff" font-family="monospace" font-size="11">FK product_id (UUID)</text>
  </g>

  <!-- Table 4: products -->
  <g transform="translate(510, 290)">
    <rect width="140" height="90" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <rect width="140" height="26" rx="6" fill="#21262d" />
    <text x="12" y="18" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">⌗ products</text>
    <text x="12" y="44" fill="#7ee787" font-family="monospace" font-size="11">PK id (UUID)</text>
    <text x="12" y="62" fill="#58a6ff" font-family="monospace" font-size="11">FK category_id</text>
    <text x="12" y="80" fill="#c9d1d9" font-family="monospace" font-size="11">sku (VARCHAR)</text>
  </g>

  <!-- Table 5: payment_transactions -->
  <g transform="translate(140, 240)">
    <rect width="160" height="90" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <rect width="160" height="26" rx="6" fill="#21262d" />
    <text x="12" y="18" fill="#58a6ff" font-family="monospace" font-size="12" font-weight="bold">⌗ payment_transactions</text>
    <text x="12" y="44" fill="#7ee787" font-family="monospace" font-size="11">PK id (UUID)</text>
    <text x="12" y="62" fill="#58a6ff" font-family="monospace" font-size="11">FK order_id (UUID)</text>
    <text x="12" y="80" fill="#c9d1d9" font-family="monospace" font-size="11">amount (NUMERIC)</text>
  </g>

  <!-- HUD Overlay -->
  <rect x="20" y="20" width="310" height="34" rx="17" fill="#161b22" stroke="#30363d" />
  <circle cx="38" cy="37" r="5" fill="#7ee787" />
  <text x="52" y="41" fill="#c9d1d9" font-family="monospace" font-size="11" font-weight="bold">SCHEMA-MAP // POSTGRESQL GRAPH</text>
</svg>
